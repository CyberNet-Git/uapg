# Релиз на GitHub и публикация на PyPI в одном запуске.
# GITHUB_TOKEN не умеет триггерить другие workflow, поэтому нельзя
# создавать релиз в одном файле и ждать release: published в другом.
#
# Запуск:
#   git tag 0.2.14 && git push origin 0.2.14
#   либо Actions → Upload Python Package → Run workflow (для уже существующего тега)

name: Upload Python Package

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег для публикации (например 0.2.13)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      latest: ${{ steps.meta.outputs.latest }}
    steps:
      - name: Resolve tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          case "${EVENT_NAME}" in
            workflow_dispatch) TAG="${DISPATCH_TAG}" ;;
            *) TAG="${REF_NAME}" ;;
          esac
          TAG="${TAG#v}"
          TAG="$(echo "${TAG}" | tr -d '[:space:]')"
          if [ -z "${TAG}" ]; then
            echo "Empty tag"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ "${TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

  release-build:
    runs-on: ubuntu-latest
    needs: resolve-tag
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify pyproject.toml version matches tag
        env:
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "tag=${TAG}"
          echo "pyproject=${PKG_VERSION}"
          if [ "${PKG_VERSION}" != "${TAG}" ]; then
            echo "Version mismatch: pyproject.toml=${PKG_VERSION} tag=${TAG}"
            exit 1
          fi

      - name: Extract changelog notes
        env:
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          tag = os.environ["TAG"]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"^## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=^## |\Z)"
          match = re.search(pattern, text, re.M | re.S)
          notes = (match.group(1).strip() if match else "") or f"Release {tag}"
          pathlib.Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY

      - name: Build release distributions
        run: |
          python -m pip install build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          name: ${{ needs.resolve-tag.outputs.tag }}
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ needs.resolve-tag.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.resolve-tag.outputs.latest == 'true' }}
          files: dist/*

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - resolve-tag
      - release-build
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/uapg/${{ needs.resolve-tag.outputs.tag }}

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
