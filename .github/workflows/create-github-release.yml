# Создаёт GitHub Release при пуше semver-тега (например 0.2.13).
# Публикация на PyPI остаётся в python-publish.yml и срабатывает
# на событие release: published (в том числе от этого workflow).

name: Create GitHub Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify pyproject.toml version matches tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "tag=${TAG}"
          echo "pyproject=${PKG_VERSION}"
          if [ "${PKG_VERSION}" != "${TAG}" ]; then
            echo "Version mismatch: pyproject.toml=${PKG_VERSION} tag=${TAG}"
            exit 1
          fi

      - name: Detect prerelease
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "${TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          tag = os.environ["TAG"]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"^## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=^## |\Z)"
          match = re.search(pattern, text, re.M | re.S)
          notes = (match.group(1).strip() if match else "") or f"Release {tag}"
          pathlib.Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.meta.outputs.latest == 'true' }}
